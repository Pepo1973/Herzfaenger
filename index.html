<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Herzfänger</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Trebuchet MS", system-ui, sans-serif;
      background: #11152e;
      color: #fff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: radial-gradient(ellipse at 50% 0%, #3e3974 0%, #11152e 72%);
    }

    main { width: min(100%, 540px); }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      letter-spacing: .04em;
    }

    .frame {
      overflow: hidden;
      border: 3px solid #f5d78c;
      border-radius: 18px;
      background: #22264c;
      box-shadow: 0 18px 60px #0007;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 9 / 16;
      touch-action: none;
    }

    .help {
      margin: 12px 0 0;
      text-align: center;
      color: #e1ddff;
      font-size: .95rem;
    }

    .motion-button {
      display: block;
      margin: 14px auto 0;
      padding: 11px 18px;
      border: 1px solid #ffe2a0;
      border-radius: 12px;
      background: #40396f;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .motion-button:disabled {
      opacity: .7;
      cursor: default;
    }

    .motion-status {
      min-height: 1.3em;
      margin: 8px 0 0;
      color: #ffe2a0;
      text-align: center;
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>🫶 Herzfänger</h1>
    <div class="frame">
      <canvas id="game" width="540" height="960" aria-label="Fange die fallenden Herzen mit deinen Händen"></canvas>
    </div>
    <p class="help">Kippe dein Handy oder nutze ← → / A-D. Goldene Herzen schenken Leben. Die Runde läuft endlos weiter; R startet neu.</p>
    <button class="motion-button" id="motionButton" type="button">Bewegungssteuerung aktivieren</button>
    <p class="motion-status" id="motionStatus" role="status" aria-live="polite"></p>
  </main>

  <script>
    const canvas = document.querySelector("#game");
    const ctx = canvas.getContext("2d");
    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const keys = { left: false, right: false };
    const hearts = [];
    let sparkles = [];
    const motionButton = document.querySelector("#motionButton");
    const motionStatus = document.querySelector("#motionStatus");

    let hands;
    let score;
    let lives;
    let spawnTimer;
    let lastTime = 0;
    let motionEnabled = false;
    let neutralGamma = null;
    let tiltPosition = 0;

    async function enableMotionControls() {
      if (!("DeviceOrientationEvent" in window)) {
        motionStatus.textContent = "Dieses Gerät unterstützt keine Bewegungssensoren.";
        return;
      }

      try {
        if (typeof DeviceOrientationEvent.requestPermission === "function") {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission !== "granted") {
            motionStatus.textContent = "Sensorfreigabe wurde nicht erteilt.";
            return;
          }
        }

        window.addEventListener("deviceorientation", handleDeviceOrientation);
        motionEnabled = true;
        motionButton.disabled = true;
        motionButton.textContent = "Bewegungssteuerung aktiviert";
        motionStatus.textContent = "Kippe das Handy, um die Hände zu bewegen.";
      } catch (error) {
        motionStatus.textContent = "Sensor konnte nicht aktiviert werden. Prüfe die Browserfreigabe.";
        console.error("Bewegungssteuerung konnte nicht aktiviert werden:", error);
      }
    }

    function handleDeviceOrientation(event) {
      if (event.gamma === null) return;
      if (neutralGamma === null) neutralGamma = event.gamma;
      const tilt = event.gamma - neutralGamma;
      const deadZone = 4;
      const usableTilt = Math.abs(tilt) < deadZone ? 0 : tilt - Math.sign(tilt) * deadZone;
      tiltPosition = Math.max(-1, Math.min(1, usableTilt / 22));
    }

    function resetGame() {
      hands = { x: WIDTH / 2 - 88, y: HEIGHT - 105, w: 176, h: 70, speed: 640 };
      score = 0;
      lives = 3;
      spawnTimer = 0;
      hearts.length = 0;
      neutralGamma = null;
      tiltPosition = 0;
    }

    function moveHandsTo(clientX) {
      const bounds = canvas.getBoundingClientRect();
      const scale = WIDTH / bounds.width;
      hands.x = Math.max(0, Math.min(WIDTH - hands.w, (clientX - bounds.left) * scale - hands.w / 2));
    }

    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (["arrowleft", "arrowright"].includes(key)) event.preventDefault();
      if (key === "r") resetGame();
      if (key === "arrowleft" || key === "a") keys.left = true;
      if (key === "arrowright" || key === "d") keys.right = true;
    });

    window.addEventListener("keyup", (event) => {
      const key = event.key.toLowerCase();
      if (key === "arrowleft" || key === "a") keys.left = false;
      if (key === "arrowright" || key === "d") keys.right = false;
    });

    canvas.addEventListener("pointerdown", (event) => {
      canvas.setPointerCapture(event.pointerId);
      moveHandsTo(event.clientX);
    });
    canvas.addEventListener("pointermove", (event) => {
      if (event.buttons || event.pointerType === "touch") moveHandsTo(event.clientX);
    });
    motionButton.addEventListener("click", enableMotionControls);

    function createHeart() {
      const golden = Math.random() < 0.1;
      const radius = (golden ? 18 : 15) + Math.random() * 8;
      hearts.push({
        x: radius + Math.random() * (WIDTH - radius * 2),
        y: -radius,
        radius,
        golden,
        speed: 120 + Math.random() * 55,
        rotation: (Math.random() - 0.5) * 0.55,
        spin: (Math.random() - 0.5) * 0.8
      });
    }

    function update(dt) {
      const speedMultiplier = 1.15 ** Math.floor(score / 50);
      const direction = Number(keys.right) - Number(keys.left);
      const movement = (direction + tiltPosition * 1.7) * hands.speed * dt;
      hands.x = Math.max(0, Math.min(WIDTH - hands.w, hands.x + movement));

      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        createHeart();
        spawnTimer = 0.6 + Math.random() * 0.15;
      }

      for (let index = hearts.length - 1; index >= 0; index--) {
        const heart = hearts[index];
        heart.y += heart.speed * speedMultiplier * dt;
        heart.rotation += heart.spin * dt;

        const caught = heart.y + heart.radius >= hands.y &&
          heart.y - heart.radius <= hands.y + hands.h &&
          heart.x + heart.radius >= hands.x - 10 &&
          heart.x - heart.radius <= hands.x + hands.w + 10;
        if (caught) {
          hearts.splice(index, 1);
          score++;
          if (heart.golden) lives++;
          continue;
        }

        if (heart.y - heart.radius > HEIGHT) {
          hearts.splice(index, 1);
          lives = Math.max(0, lives - 1);
        }
      }
    }

    function drawHeart(x, y, radius, rotation) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.scale(radius / 22, radius / 22);
      ctx.beginPath();
      ctx.moveTo(0, 18);
      ctx.bezierCurveTo(-5, 14, -22, 3, -22, -7);
      ctx.bezierCurveTo(-22, -20, -5, -23, 0, -11);
      ctx.bezierCurveTo(5, -23, 22, -20, 22, -7);
      ctx.bezierCurveTo(22, 3, 5, 14, 0, 18);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawBackground(time) {
      const sky = ctx.createLinearGradient(0, 0, 0, HEIGHT);
      sky.addColorStop(0, "#22264c");
      sky.addColorStop(1, "#554477");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      for (const sparkle of sparkles) {
        const glow = 0.35 + (Math.sin(time / 500 + sparkle.phase) + 1) * 0.3;
        ctx.globalAlpha = glow;
        ctx.fillStyle = "#fff4c1";
        ctx.beginPath();
        ctx.arc(sparkle.x, sparkle.y, sparkle.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      ctx.fillStyle = "#f0c77a";
      ctx.beginPath();
      ctx.arc(WIDTH * 0.82, HEIGHT * 0.12, 49, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#34345e";
      ctx.beginPath();
      ctx.arc(WIDTH * 0.84, HEIGHT * 0.105, 48, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawHands() {
      ctx.save();
      ctx.translate(hands.x, hands.y);
      for (const side of [0, 1]) {
        ctx.save();
        ctx.translate(side === 0 ? 20 : hands.w - 20, 0);
        ctx.scale(side === 0 ? 1 : -1, 1);
        ctx.scale(0.9, 0.9);

        const skin = ctx.createLinearGradient(10, 14, 66, 66);
        skin.addColorStop(0, "#ffd3b4");
        skin.addColorStop(0.55, "#f6b48f");
        skin.addColorStop(1, "#e99a78");
        ctx.fillStyle = skin;
        ctx.strokeStyle = "#d78569";
        ctx.lineWidth = 2;
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(3, 70);
        ctx.lineTo(15, 48);
        ctx.quadraticCurveTo(18, 43, 23, 47);
        ctx.lineTo(21, 26);
        ctx.quadraticCurveTo(20, 19, 25, 18);
        ctx.quadraticCurveTo(30, 17, 31, 24);
        ctx.lineTo(34, 43);
        ctx.lineTo(34, 17);
        ctx.quadraticCurveTo(34, 10, 40, 10);
        ctx.quadraticCurveTo(46, 10, 46, 17);
        ctx.lineTo(47, 43);
        ctx.lineTo(51, 23);
        ctx.quadraticCurveTo(52, 16, 58, 18);
        ctx.quadraticCurveTo(63, 19, 62, 26);
        ctx.lineTo(59, 47);
        ctx.lineTo(65, 35);
        ctx.quadraticCurveTo(68, 29, 73, 32);
        ctx.quadraticCurveTo(78, 35, 75, 42);
        ctx.lineTo(65, 62);
        ctx.quadraticCurveTo(62, 70, 53, 72);
        ctx.lineTo(16, 72);
        ctx.quadraticCurveTo(8, 72, 3, 70);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = "#ffe3d0";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(18, 53);
        ctx.quadraticCurveTo(29, 57, 37, 55);
        ctx.moveTo(43, 57);
        ctx.quadraticCurveTo(52, 60, 60, 55);
        ctx.stroke();

        ctx.fillStyle = "#ffe9dc";
        for (const [x, y, angle] of [[24, 23, -0.1], [38, 15, 0], [55, 22, 0.1], [70, 36, 0.5]]) {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(angle);
          ctx.beginPath();
          ctx.ellipse(0, 0, 2.2, 3.5, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        ctx.fillStyle = "#b779d0";
        ctx.beginPath();
        ctx.roundRect(2, 65, 17, 10, [3, 2, 3, 5]);
        ctx.fill();
        ctx.fillStyle = "#e9c4f2";
        ctx.fillRect(5, 67, 10, 2);
        ctx.restore();
      }
      ctx.restore();
    }

    function drawHud() {
      ctx.fillStyle = "#161a39cc";
      ctx.beginPath();
      ctx.roundRect(20, 18, 205, 54, 15);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "bold 22px Trebuchet MS, sans-serif";
      ctx.fillText(`Gefangen: ${score}`, 38, 53);

      ctx.textAlign = "right";
      ctx.font = "24px Trebuchet MS, sans-serif";
      ctx.fillText(`Leben: ${lives} ❤️`, WIDTH - 24, 54);
      ctx.textAlign = "left";
    }

    function frame(time) {
      const dt = Math.min((time - lastTime) / 1000 || 0, 0.033);
      lastTime = time;
      update(dt);
      drawBackground(time);
      for (const heart of hearts) {
        ctx.save();
        ctx.shadowColor = heart.golden ? "#ffe17a" : "#ff668d";
        ctx.shadowBlur = heart.golden ? 24 : 18;
        ctx.fillStyle = heart.golden ? "#ffd447" : "#ff577f";
        drawHeart(heart.x, heart.y, heart.radius, heart.rotation);
        ctx.restore();
      }
      drawHands();
      drawHud();
      requestAnimationFrame(frame);
    }

    resetGame();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
